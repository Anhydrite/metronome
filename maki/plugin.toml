# Metronome plugin permissions.
#
# scripts/install.sh merges these into the user's plugin.toml without
# overwriting a key the user already set. A key set to false is left alone and
# the installer warns: the plugin may then fail at the first gated call.

[permissions]
fs_read = true
fs_write = true
run = true
env = true
agent = true
session_read = true
session_write = true
session_settings = true
input = true
